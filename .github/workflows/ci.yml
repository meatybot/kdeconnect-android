#
# GitHub equivalent of .gitlab-ci.yml (buildLintAndTest job).

name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  buildLintAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK; AGP downloads the required platform/build-tools.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and test
        run: ./gradlew --no-daemon -Pci --console=plain assembleDebug lintDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: |
            build/outputs/
            build/reports/
