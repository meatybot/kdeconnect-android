#
# Builds a signed release APK for a pushed v* tag and publishes it as a GitHub release.
# Needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KDECONNECT_RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          KDECONNECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KDECONNECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon -Pci --console=plain testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          apk=build/outputs/apk/release/kdeconnect-android-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "kdeconnect-android-$TAG.apk"
          sha256sum "kdeconnect-android-$TAG.apk" > "kdeconnect-android-$TAG.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" "kdeconnect-android-$TAG.apk" "kdeconnect-android-$TAG.apk.sha256" --clobber
